<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting to Canva AR…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, sans-serif; display: flex; align-items: center;
           justify-content: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
    .card { text-align: center; padding: 2rem; }
    .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0;
               border-top-color: #7c3aed; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #666; font-size: 15px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <p>Opening Canva AR…</p>
  </div>
  <script>
    // Forward all query params (code, state) into the app's custom URL scheme
    const appURL = "canvaar://oauth/callback" + window.location.search;
    window.location.href = appURL;

    // Fallback message if app isn't installed
    setTimeout(() => {
      document.querySelector("p").textContent =
        "App not found. Make sure Canva AR is installed on this device.";
      document.querySelector(".spinner").style.display = "none";
    }, 2500);
  </script>
</body>
</html>
